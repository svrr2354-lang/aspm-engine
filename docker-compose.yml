services:
  neo4j:
    image: neo4j:5.12.0
    container_name: aspm-graph-db
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt connection for Python
    environment:
      - NEO4J_AUTH=neo4j/aspm_admin_123
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: aspm-vector-db
    ports:
      - "8000:8000" # REST API for LangChain/Python
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

volumes:
  neo4j_data:
  chroma_data: